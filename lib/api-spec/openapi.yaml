openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: FEZI AI agent catalog
  - name: dashboard
    description: Workspace dashboard
  - name: chat
    description: Agent conversations
  - name: projects
    description: Workspace project organization
  - name: voice
    description: Speech synthesis for agent responses
  - name: media
    description: Media provider capabilities and model catalog
  - name: billing
    description: Plans and crypto payment estimates
  - name: connectors
    description: External MCP connector management
  - name: agent-access
    description: External access to FEZI Agents
  - name: custom-agents
    description: Persistent Agent Builder and community Agents
  - name: prompt-studio
    description: Public community prompts and examples
paths:
  /payments/redeem-codes:
    get:
      operationId: listRedeemCodeOrders
      parameters:
        - in: query
          name: before
          schema: { type: string }
      responses:
        "200":
          description: Authenticated buyer purchase history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemCodeHistory"
  /payments/redeem-codes/orders:
    post:
      operationId: createRedeemCodeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCodePurchaseInput"
      responses:
        "201":
          description: Unique exact stablecoin transfer amount reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemCodeOrderResult"
  /payments/redeem-codes/orders/{id}/verify:
    post:
      operationId: verifyRedeemCodeOrder
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCodeVerificationInput"
      responses:
        "200":
          description: Verified or pending order; codes are issued only after finality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemCodeOrderResult"
  /payments/redeem-codes/redeem:
    post:
      operationId: redeemPurchasedCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasedCodeInput"
      responses:
        "200":
          description: One-time account credit award (not subscription or API access)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedCodeResult"
  /site-api-keys:
    get:
      operationId: listSiteApiKeys
      responses:
        "200":
          description: Signed-in owner's active Site API keys and current shared balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteApiKeyList" }
    post:
      operationId: createSiteApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteApiKeyInput" }
      responses:
        "201":
          description: Created key; plaintext is displayed once and never listed again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteApiKeyCreated" }
  /site-api-keys/{id}:
    patch:
      operationId: updateSiteApiKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteApiKeyUpdate" }
      responses:
        "200":
          description: Updated owner-scoped key metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteApiKeyUpdated" }
    delete:
      operationId: revokeSiteApiKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Key revoked and cannot be used again }
  /payments/admin-codes/redeem:
    post:
      operationId: redeemAdminGiftCode
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCodeRedeemInput" }
      responses:
        "200":
          description: Credit or membership code redeemed once by an authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCodeRedeemResult" }
  /admin/ai/ask:
    post:
      operationId: askAdminAiQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAiQuestionInput" }
      responses:
        "200":
          description: Answer from the selected GAPGPT model, admin session required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiAnswer" }
  /admin/codes:
    get:
      operationId: listAdminCodes
      responses:
        "200":
          description: Codes and redemption counts, admin session required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCodeList" }
    post:
      operationId: createAdminCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCodeInput" }
      responses:
        "201":
          description: Created code, admin session required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCodeResponse" }
  /admin/codes/{id}:
    patch:
      operationId: setAdminCodeActive
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCodeActiveInput" }
      responses:
        "200":
          description: Updated code, admin session required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCodeResponse" }
  /community/posts:
    $ref: './community.yaml#/paths/~1community~1posts'
  /community/posts/{id}:
    $ref: './community.yaml#/paths/~1community~1posts~1{id}'
  /community/posts/{id}/like:
    $ref: './community.yaml#/paths/~1community~1posts~1{id}~1like'
  /community/uploads:
    $ref: './community.yaml#/paths/~1community~1uploads'
  /community/profiles/{id}:
    $ref: './community.yaml#/paths/~1community~1profiles~1{id}'
  /community/profile:
    $ref: './community.yaml#/paths/~1community~1profile'
  /community/profiles/{id}/follow:
    $ref: './community.yaml#/paths/~1community~1profiles~1{id}~1follow'
  /community/profiles/{id}/block:
    $ref: './community.yaml#/paths/~1community~1profiles~1{id}~1block'
  /community/reports:
    $ref: './community.yaml#/paths/~1community~1reports'
  /community/notifications:
    $ref: './community.yaml#/paths/~1community~1notifications'
  /community/notifications/read:
    $ref: './community.yaml#/paths/~1community~1notifications~1read'
  /community/conversations:
    $ref: './community.yaml#/paths/~1community~1conversations'
  /community/messages/{userId}:
    $ref: './community.yaml#/paths/~1community~1messages~1{userId}'
  /community/banners:
    $ref: './community.yaml#/paths/~1community~1banners'
  /community/visit:
    $ref: './community.yaml#/paths/~1community~1visit'
  /community/data:
    $ref: './community.yaml#/paths/~1community~1data'
  /admin/community:
    $ref: './community.yaml#/paths/~1admin~1community'
  /admin/community/banners:
    $ref: './community.yaml#/paths/~1admin~1community~1banners'
  /admin/community/uploads:
    $ref: './community.yaml#/paths/~1admin~1community~1uploads'
  /admin/community/news:
    $ref: './community.yaml#/paths/~1admin~1community~1news'
  /admin/community/reports/{id}:
    $ref: './community.yaml#/paths/~1admin~1community~1reports~1{id}'
  /admin/community/posts/{id}:
    $ref: './community.yaml#/paths/~1admin~1community~1posts~1{id}'
  /admin/community/analytics:
    $ref: './community.yaml#/paths/~1admin~1community~1analytics'
  /admin/community/news/sync:
    $ref: './community.yaml#/paths/~1admin~1community~1news~1sync'
  /gemini/image:
    post:
      operationId: generateGeminiImage
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeminiImageInput" }
      responses:
        "200": { description: Generated image, content: { application/json: { schema: { $ref: "#/components/schemas/GeminiImageResponse" } } } }
  /gemini/image-to-prompt:
    post:
      operationId: analyzeImageToPrompt
      tags: [media]
      summary: Analyze a reference image and return an editable prompt package
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageToPromptInput" }
      responses:
        "200": { description: Structured image analysis and prompts, content: { application/json: { schema: { $ref: "#/components/schemas/ImageToPromptResponse" } } } }
        "400": { description: Unsupported image or invalid request }
        "402": { description: Subscription or Credits required }
        "502": { description: Vision analysis failed or returned an invalid prompt package }
  /prompt-studio/generate:
    post:
      operationId: generatePromptStudioPrompt
      tags: [prompt-studio]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptStudioGenerateInput" }
      responses:
        "200": { description: Generated prompt, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioGenerateResponse" } } } }
  /prompt-studio/prompts:
    get:
      operationId: listPromptStudioPrompts
      tags: [prompt-studio]
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [trending, newest, top-rated, relevant, popular] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: Prompt summaries, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioList" } } } }
    post:
      operationId: createPromptStudioPrompt
      tags: [prompt-studio]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioPromptInput" } } } }
      responses:
        "201": { description: Created prompt, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioPromptResponse" } } } }
  /prompt-studio/prompts/{id}:
    get:
      operationId: getPromptStudioPrompt
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Prompt detail, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioDetailResponse" } } } }
    delete:
      operationId: deletePromptStudioPrompt
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /prompt-studio/prompts/{id}/unlock:
    post:
      operationId: unlockPromptStudioPrompt
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptStudioUnlockInput" }
      responses:
        "200": { description: Prompt text unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioUnlockResponse" } } } }
        "400": { description: Invalid action }
        "401": { description: Authentication required }
        "402": { description: Insufficient credits or free unlock limit reached }
        "404": { description: Prompt not found }
  /prompt-studio/prompts/{id}/rating:
    put:
      operationId: ratePromptStudioPrompt
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptStudioRatingInput" }
      responses:
        "200": { description: Rating saved, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioRatingResponse" } } } }
        "400": { description: Rating must be from 1 to 5 }
        "404": { description: Prompt not found }
  /prompt-studio/prompts/{id}/images:
    post:
      operationId: uploadPromptStudioImage
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses: { "201": { description: Uploaded image, content: { application/json: { schema: { type: object } } } } }
  /prompt-studio/prompts/{promptId}/images/{imageId}:
    delete:
      operationId: deletePromptStudioImage
      tags: [prompt-studio]
      parameters:
        - { name: promptId, in: path, required: true, schema: { type: string } }
        - { name: imageId, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: Deleted } }
  /prompt-studio/profiles/{publicId}:
    get:
      operationId: getPromptStudioProfile
      tags: [prompt-studio]
      parameters: [{ name: publicId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Public profile, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioProfileResponse" } } } }
  /prompt-studio/prompts/{id}/comments:
    post:
      operationId: createPromptStudioComment
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromptStudioCommentInput" } } } }
      responses:
        "201": { description: Created comment, content: { application/json: { schema: { type: object } } } }
  /prompt-studio/comments/{id}:
    delete:
      operationId: deletePromptStudioComment
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /prompt-studio/images/{id}:
    get:
      operationId: getPromptStudioImage
      tags: [prompt-studio]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Image bytes, content: { image/webp: { schema: { type: string, format: binary } } } } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gapgpt/status:
    get:
      operationId: getGapGptStatus
      tags: [media]
      summary: Check GapGPT capability availability and model catalog
      responses:
        "200":
          description: GapGPT provider status without exposing credentials
          content:
            application/json:
              schema:
                type: object
                required: [configured, reachable, catalog]
                properties:
                  configured: { type: boolean }
                  reachable: { type: boolean }
                  baseUrl: { type: string }
                  status: { type: integer }
                  models:
                    type: array
                    items: { type: string }
                  catalog:
                    type: array
                    items:
                      type: object
                      required: [id, category, inputPrice, unit, requiresSubscription, expensive]
                      properties:
                        id: { type: string }
                        category: { type: string }
                        inputPrice: { type: number }
                        outputPrice: { type: number, nullable: true }
                        unit: { type: string }
                        requiresSubscription: { type: boolean }
                        expensive: { type: boolean }
                        live: { type: boolean }
                  capabilities:
                    type: object
                    additionalProperties: { type: boolean }
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List available AI agents
      responses:
        "200":
          description: Agent catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  /custom-agents:
    get:
      operationId: listCustomAgents
      tags: [custom-agents]
      summary: List custom Agents owned by the current workspace
      responses:
        "200":
          description: Custom Agent list and plan quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomAgentsResponse"
    post:
      operationId: createCustomAgent
      tags: [custom-agents]
      summary: Create a persistent custom Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomAgentInput"
      responses:
        "201":
          description: Created custom Agent
          content:
            application/json:
              schema:
                type: object
                required: [agent, limit, used]
                properties:
                  agent: { $ref: "#/components/schemas/CustomAgent" }
                  limit: { type: integer }
                  used: { type: integer }
        "402":
          description: Custom Agent quota reached
  /custom-agents/discover:
    get:
      operationId: discoverCustomAgents
      tags: [custom-agents]
      summary: List public community Agents
      responses:
        "200":
          description: Public custom Agents
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/CustomAgent" }
  /custom-agents/analyze:
    post:
      operationId: analyzeCustomAgentPurpose
      tags: [custom-agents]
      summary: Detect a starting configuration from a natural-language purpose
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomAgentPurposeAnalysisInput" }
      responses:
        "200":
          description: Suggested Agent configuration
          content:
            application/json:
              schema:
                type: object
                required: [detected, suggestedCapabilities, suggestedTools, suggestedInstructions]
                properties:
                  detected:
                    type: array
                    items:
                      type: object
                      required: [label, capabilityId]
                      properties:
                        label: { type: string }
                        capabilityId: { type: string }
                  suggestedCapabilities:
                    type: array
                    items: { type: string }
                  suggestedTools:
                    type: array
                    items: { type: string }
                  suggestedInstructions: { type: string }
  /custom-agents/{agentId}:
    get:
      operationId: getCustomAgent
      tags: [custom-agents]
      summary: Get an owned custom Agent including private builder configuration
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Custom Agent configuration
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    allOf:
                      - $ref: "#/components/schemas/CustomAgent"
                      - type: object
                        properties:
                          systemInstructions: { type: string }
                          developerInstructions: { type: string }
                          knowledgeText: { type: string }
    patch:
      operationId: updateCustomAgent
      tags: [custom-agents]
      summary: Update an owned custom Agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomAgentInput"
      responses:
        "200":
          description: Updated custom Agent
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent: { $ref: "#/components/schemas/CustomAgent" }
    delete:
      operationId: deleteCustomAgent
      tags: [custom-agents]
      summary: Delete an owned custom Agent and its API keys
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Custom Agent deleted }
  /custom-agents/{agentId}/api-keys:
    get:
      operationId: listCustomAgentApiKeys
      tags: [custom-agents]
      summary: List safe API key metadata
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: API key metadata
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/CustomAgentApiKey" }
    post:
      operationId: createCustomAgentApiKey
      tags: [custom-agents]
      summary: Create a one-time-display API key
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: API key shown once
          content:
            application/json:
              schema:
                type: object
                required: [key, apiKey, endpoint, warning]
                properties:
                  key: { $ref: "#/components/schemas/CustomAgentApiKey" }
                  apiKey: { type: string }
                  endpoint: { type: string }
                  warning: { type: string }
  /custom-agents/{agentId}/api-keys/{keyId}:
    delete:
      operationId: revokeCustomAgentApiKey
      tags: [custom-agents]
      summary: Revoke a custom Agent API key
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: API key revoked }
  /custom-agents/{agentId}/chat:
    post:
      operationId: customAgentApiChat
      tags: [custom-agents]
      summary: Chat with a published custom Agent using its API key
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomAgentApiChatInput" }
      responses:
        "200":
          description: Custom Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "401": { description: Invalid or revoked API key }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the current workspace dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /chat:
    post:
      operationId: sendChat
      tags: [chat]
      summary: Send a message to an AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /chat/media/{messageId}:
    get:
      operationId: getChatMedia
      tags: [chat]
      summary: Stream protected generated media belonging to a chat message
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Generated image or MP4 video
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "404":
          description: Chat media not found or inaccessible
  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get the latest saved conversation for an Agent
      parameters:
        - name: agentId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: appId
          in: query
          required: false
          schema: { type: string, enum: [claude, deepseek, gapgpt, openai, mistral] }
        - name: conversationId
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Latest conversation and its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistory"
  /chat/conversations:
    get:
      operationId: listChatConversations
      tags: [chat]
      summary: List saved conversations
      responses:
        "200":
          description: Saved conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationsResponse"
    post:
      operationId: createChatConversation
      tags: [chat]
