  /agent/v1/chat:
    post:
      operationId: externalAgentChat
      tags: [agent-access]
      summary: Send a message to the Agent represented by a FEZI API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalChatInput"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "401":
          description: Invalid API key
  /mcp:
    post:
      operationId: mcpRpc
      tags: [agent-access]
      summary: FEZI Site API Streamable HTTP MCP endpoint
      description: |
        Stateless MCP JSON-RPC 2.0 over POST. Send `Content-Type: application/json`
        and `Accept: application/json, text/event-stream`. Initialize and ping
        are public. Private tool listing and tool calls require an existing
        FEZI Site API key in `Authorization: Bearer <SITE_API_KEY>`. Supported
        tools are `fezi_site_models` and `fezi_site_chat`; generation retains the
        key's Agent/model scope, rate limits, and API Credit balance. No API key
        is accepted in a URL or query parameter.

        Initialize with protocol version `2025-03-26`, then send
        `notifications/initialized`. Example endpoint:
        `https://persiandarkhorse.com/api/mcp`.

        Example authorized request (provide the key via your client's secure
        secret store):

        ```sh
        curl -X POST 'https://persiandarkhorse.com/api/mcp' \
          -H "Authorization: Bearer ${FEZI_SITE_API_KEY}" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json, text/event-stream' \
          --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
        ```

        To generate, call `tools/call` with
        `{"name":"fezi_site_chat","arguments":{"message":"Hello"}}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpRequest"
      responses:
        "200":
          description: JSON-RPC response; notification-only requests return 202 without a body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResponse"
        "202": { description: Notification accepted without a response body }
        "400": { description: "Invalid JSON-RPC request, unsupported protocol version, or forbidden query parameter" }
        "401": { description: "Missing, invalid, or revoked FEZI Site API key for a private method" }
        "406": { description: Accept must include application/json and text/event-stream }
        "413": { description: Request body exceeds the 64 KB limit }
        "415": { description: Content-Type must be application/json }
        "429": { description: Site API rate limit exceeded }
    get:
      operationId: getFeziStreamableMcp
      tags: [agent-access]
      summary: Unsupported stateless MCP event stream
      responses:
        "405": { description: This stateless endpoint does not open server-sent event streams }
    delete:
      operationId: deleteFeziStreamableMcpSession
      tags: [agent-access]
      summary: Gracefully terminate an MCP session
      responses:
        "204": { description: No session state is retained }
